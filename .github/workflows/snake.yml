name: Snake

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%238B5CF6&color_dots=%230A1020,%231B2340,%233B2E6B,%236D4BC7,%23A78BFA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%23111827,%231B2340,%233B2E6B,%236D4BC7,%23C4B5FD

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
